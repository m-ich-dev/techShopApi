name: Deploy API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on:
      - self-hosted
      - rpi

    steps:
      - uses: actions/checkout@v6

      - name: Create .env
        run: |
          cat > .env << EOF
          APP_NAME=${{ secrets.APP_NAME }}
          APP_PORT=${{ secrets.APP_PORT }}

          APP_JWT_ACCESS_SECRET_KEY=${{ secrets.APP_JWT_ACCESS_SECRET_KEY }}

          APP_DB_HOST=pg
          APP_DB_PORT=${{ secrets.APP_DB_PORT }}

          APP_DB_USER=${{ secrets.APP_DB_USER }}
          APP_DB_NAME=${{ secrets.APP_DB_NAME }}
          APP_DB_PASSWORD=${{ secrets.APP_DB_PASSWORD }}

          APP_DB_MAX_CONS=${{ secrets.APP_DB_MAX_CONS }}
          APP_DB_MIN_CONS=${{ secrets.APP_DB_MIN_CONS }}

          NODE_ENV=production
          EOF

      - name: Build image
        run: |
          docker compose --profile demapi build

      - name: Execute migrations
        run: |
          docker compose --profile demapi run --rm npm run migrate:pr:latest

      - name: Build and deploy
        run: |
          docker compose --profile demapi up -d