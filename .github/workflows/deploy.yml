name: Personal site

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: [self-hosted, rpi]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'


    - name: Install and Build
      run: |
        npm ci
        npm run build

    - name: Copy files to Nginx directory
      run: |
        rsync -rlpz --no-g --delete dist/ /var/www/docker-html/personal/
